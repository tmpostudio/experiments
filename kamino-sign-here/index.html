<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kamino Newsletter</title>
  <meta name="description" content="Monthly updates on Kamino products, markets, and the onchain credit ecosystem.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1023">
  <link rel="stylesheet" href="css/v2.css?v=1023">
</head>
<body>
  <main>
    <section class="newsletter" aria-labelledby="newsletter-title">
      <div class="newsletter__inner">
        <div class="newsletter__content">
          <div class="copy">
            <h1 class="title" id="newsletter-title">Sign here for alpha.</h1>
            <p class="lede">Monthly updates on Kamino products, markets, and the onchain credit ecosystem.</p>
          </div>

          <!-- Set data-endpoint to your ESP / API URL to POST signups as JSON. Empty = demo mode. -->
          <form class="form" id="newsletter-form" data-endpoint="" novalidate>
            <div class="field-row">
              <label class="visually-hidden" for="first-name">First name</label>
              <input class="input input--name" id="first-name" name="firstName" type="text"
                     placeholder="First Name" autocomplete="given-name" maxlength="20" required>

              <label class="visually-hidden" for="email">Email</label>
              <input class="input input--email" id="email" name="email" type="email"
                     placeholder="you@company.com" autocomplete="email" required>

              <button class="button" type="submit">
                <span class="button__label">Sign</span>
              </button>
            </div>

            <div class="legal">
              <label class="consent">
                <input class="consent__input" type="checkbox" name="consent" required>
                <span class="consent__box" aria-hidden="true">
                  <svg viewBox="0 0 16 16" fill="none"><path d="M4 8.2 6.8 11 12 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="consent__text">Yes, send me the Kamino newsletter.</span>
              </label>
              <p class="fineprint">By subscribing you agree to our <a href="#">Privacy Policy</a> and consent to receive marketing emails from Kamino. Unsubscribe at any time.</p>
            </div>

            <p class="status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="newsletter__media">
          <!-- Stage is laid out at the Figma frame size (650×518) and scaled to fit, so the line and signature stay locked to the paper -->
          <div class="stage">
            <img class="stage__image" src="assets/hero-v4.webp" alt="" width="1120" height="893">
            <div class="stage__line" aria-hidden="true"></div>
            <p class="stage__label" aria-hidden="true">Signed by</p>
            <div class="signature" aria-hidden="true">
              <div class="signature__line"></div>
            </div>
            <!-- Appears once the consent box is ticked (js/v2.js) -->
            <div class="witness" aria-hidden="true">
              <p class="witness__label">Witnessed by</p>
              <img class="witness__logo" src="assets/kamino-logo.svg" alt="" width="59" height="14">
              <p class="witness__date"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/glyphs.js?v=1023"></script>
  <script src="js/signature.js?v=1023"></script>
  <script src="js/main.js?v=1023"></script>
  <script src="js/v2.js?v=1023"></script>
  <!-- Hover dot grid, parked for later: <script src="js/dots.js?v=1023"></script> -->
</body>
</html>
