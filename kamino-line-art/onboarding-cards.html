<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamino — Onboarding Cards</title>
    <style>
      * { box-sizing: border-box; }
      body {
        --ink: #000;
        --muted: #4f5153;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #fafafa;
        color: var(--ink);
        font-family: "Aeonik", "Inter", system-ui, -apple-system, sans-serif;
      }
      .lab-note {
        padding: 20px 24px 0;
        font-family: "Roboto Mono", ui-monospace, monospace;
        font-size: 11px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #939393;
      }
      .lab-note a { color: #555; }

      .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 24px 56px; }

      .modal {
        width: min(880px, 100%);
        border: 0.5px solid rgba(0, 0, 0, 0.06);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.1), 1px 0 1px rgba(0, 0, 0, 0.07);
        overflow: hidden;
      }
      .modal__art {
        position: relative;
        height: 400px;
        background: linear-gradient(180deg, #c6f4ff 0%, #ffffff 72%);
      }
      .modal__art canvas { display: block; width: 100%; height: 100%; }

      .modal__body { padding: 28px 32px 30px; }
      .modal__text { min-height: 96px; transition: opacity 0.25s ease, transform 0.3s var(--ease); }
      .modal__text.out { opacity: 0; transform: translateY(10px); }
      .modal__body h2 {
        margin: 0 0 10px;
        font-size: 28px;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .modal__body p {
        max-width: 430px;
        margin: 0;
        font-size: 15px;
        line-height: 1.25;
        color: var(--muted);
      }
      .modal__foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 26px;
      }
      .steps { display: flex; gap: 7px; }
      .steps i {
        width: 6px; height: 6px; border-radius: 50%;
        background: rgba(0, 0, 0, 0.16);
        transition: background-color 0.3s;
      }
      .steps i.on { background: var(--ink); }
      .btns { display: flex; gap: 10px; }
      .btn {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 18px;
        border: 1px solid transparent;
        border-radius: 4px;
        font: 500 13px/1 "Aeonik", "Inter", sans-serif;
        cursor: pointer;
        background: transparent;
        transition: transform 0.2s var(--ease), background-color 0.2s, color 0.2s, opacity 0.2s;
      }
      .btn:active { transform: scale(0.97); }
      .btn--ghost { border-color: rgba(0, 0, 0, 0.25); color: var(--ink); }
      .btn--ghost:hover { border-color: #000; }
      .btn--fill { background: #000; color: #fff; }
      .btn--fill:hover { background: #222; }
      .btn[disabled] { opacity: 0.35; pointer-events: none; }
    </style>
    <script type="module" crossorigin src="./assets/onboardingCards-DeUJiX2v.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="./assets/Line2-BU82jA1R.js">
    <link rel="modulepreload" crossorigin href="./assets/onboarding-swarm-LQzjGQ_u.js">
  </head>
  <body>
    <p class="lab-note">Onboarding lab — swarm in modal cards · <a href="./onboarding-lab.html">back to lab</a></p>
    <div class="center">
      <div class="modal">
        <div class="modal__art" id="art"></div>
        <div class="modal__body">
          <div class="modal__text" id="text">
            <h2 id="title"></h2>
            <p id="copy"></p>
          </div>
          <div class="modal__foot">
            <div class="steps" id="steps"></div>
            <div class="btns">
              <button class="btn btn--ghost" id="back">Back</button>
              <button class="btn btn--fill" id="next">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
