<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamino — Onboarding Art</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f3f5;
        font-family: "Aeonik", "Inter", system-ui, -apple-system, sans-serif;
        color: #111;
      }
      .tag {
        position: fixed;
        top: 20px;
        left: 24px;
        font: 11px/1 "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9a9ca1;
      }
      .tag b { color: #111; font-weight: 600; margin-right: 8px; }
      .tag a { color: #6b6e74; }

      .stage { display: flex; align-items: center; gap: 28px; }

      .chev {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #d8dade;
        background: #fff;
        color: #111;
        font-size: 19px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s;
      }
      .chev:hover { background: #111; color: #fff; }
      .chev:active { transform: scale(0.94); }

      .modal {
        width: min(520px, calc(100vw - 150px));
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 30px 70px rgba(20, 30, 45, 0.16), 0 2px 10px rgba(20, 30, 45, 0.06);
        overflow: hidden;
      }
      .modal.swap .art canvas, .modal.swap .body-in { animation: swap-in 0.28s ease both; }
      @keyframes swap-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      .art {
        position: relative;
        height: 300px;
        background:
          radial-gradient(95% 125% at 50% 0%, rgba(118, 158, 212, 0.55) 0%, rgba(188, 214, 238, 0.45) 42%, rgba(255, 255, 255, 0) 78%),
          linear-gradient(180deg, #dfeaf6 0%, #ffffff 100%);
      }
      .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: #2a2c30;
        font-size: 17px;
        cursor: pointer;
      }
      .close:hover { background: rgba(255, 255, 255, 0.65); }

      .body { padding: 24px 28px 18px; }
      .body h2 { margin: 0 0 9px; font-size: 21px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
      .body p { margin: 0 0 14px; font-size: 14px; line-height: 1.45; color: #55585d; }
      .learn { font-size: 13px; color: #1d1f23; text-decoration: none; }
      .learn:hover { text-decoration: underline; text-underline-offset: 3px; }
      .learn span { font-size: 11px; margin-left: 2px; }

      .foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px 22px; }
      .dots { display: flex; align-items: center; gap: 5px; }
      .dots i { width: 6px; height: 6px; border-radius: 3px; background: #d4d6da; transition: all 0.3s ease; }
      .dots i.on { width: 18px; background: #4a7dd6; }
      .btns { display: flex; gap: 10px; }
      .btn {
        height: 38px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: 500 14px/1 "Aeonik", "Inter", system-ui, sans-serif;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s;
      }
      .btn:active { transform: scale(0.97); }
      .btn-back { background: #fff; border-color: #dcdee2; color: #111; }
      .btn-back:hover { border-color: #111; }
      .btn-back[hidden] { display: none; }
      .btn-next { background: #141518; color: #fff; }
      .btn-next:hover { opacity: 0.84; }
    </style>
    <script type="module" crossorigin src="./assets/onboarding-DvZMsB6t.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="./assets/instrument2-BuC8FPZa.js">
  </head>
  <body>
    <p class="tag"><b>04 New users — Earn</b> onboarding art exercise · <a href="./directions.html">lab</a> · <a href="./platform-cards.html">cards</a></p>
    <div class="stage">
      <button class="chev" id="prev" aria-label="Previous">&#8249;</button>
      <section class="modal" id="modal" aria-live="polite">
        <div class="art" id="art"><button class="close" aria-label="Close">&#215;</button></div>
        <div class="body body-in">
          <h2 id="title"></h2>
          <p id="copy"></p>
          <a class="learn" href="#">Learn more <span>&#8599;</span></a>
        </div>
        <div class="foot">
          <div class="dots" id="dots"></div>
          <div class="btns">
            <button class="btn btn-back" id="back">Back</button>
            <button class="btn btn-next" id="next"></button>
          </div>
        </div>
      </section>
      <button class="chev" id="fwd" aria-label="Next">&#8250;</button>
    </div>
  </body>
</html>
