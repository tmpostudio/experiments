<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamino — Welcome Onboarding Art</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f3f5;
        font-family: "Aeonik", "Inter", system-ui, -apple-system, sans-serif;
        color: #111;
      }
      .tag {
        position: fixed;
        top: 20px;
        left: 24px;
        font: 11px/1 "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9a9ca1;
      }
      .tag b { color: #111; font-weight: 600; margin-right: 8px; }
      .tag a { color: #6b6e74; }

      .stage { display: flex; align-items: center; gap: 28px; }

      .chev {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid #d8dade;
        background: #fff;
        color: #111;
        font-size: 19px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.2s, transform 0.15s;
        flex: none;
      }
      .chev:hover { background: #111; color: #fff; }
      .chev:active { transform: scale(0.94); }

      .modal {
        width: min(940px, calc(100vw - 170px));
        height: min(600px, calc(100vh - 80px));
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 30px 70px rgba(20, 30, 45, 0.16), 0 2px 10px rgba(20, 30, 45, 0.06);
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        position: relative;
      }
      .modal.swap .art canvas, .modal.swap .panel-in { animation: swap-in 0.28s ease both; }
      @keyframes swap-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

      .art {
        position: relative;
        background: linear-gradient(135deg, #c6f4ff 0%, #fafafa 100%);
      }
      .art canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

      .panel { position: relative; display: flex; flex-direction: column; }
      .panel-in { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 40px;
      }
      .step {
        margin: 0 0 12px;
        font: 600 11px/1 "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4a7dd6;
      }
      .content h2 { margin: 0 0 12px; font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; text-wrap: balance; }
      .content p.desc { margin: 0 0 16px; font-size: 13.5px; line-height: 1.5; color: #55585d; }
      .learn { font-size: 13px; color: #1d1f23; text-decoration: none; width: fit-content; }
      .learn:hover { text-decoration: underline; text-underline-offset: 3px; }
      .learn span { font-size: 11px; margin-left: 2px; }
      .learn[hidden] { display: none; }

      /* welcome step: choice rows */
      .choices { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
      .choices[hidden] { display: none; }
      .choice {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border: 1px solid #e4e6ea;
        border-radius: 12px;
        background: #fff;
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition: border-color 0.2s, background 0.2s;
      }
      .choice:hover { border-color: #b9c6dd; background: #fafbfd; }
      .choice .ico {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #eef3fb;
        display: grid;
        place-items: center;
        font-size: 14px;
        color: #4a7dd6;
        flex: none;
      }
      .choice .txt { flex: 1; }
      .choice .txt b { display: block; font-size: 14px; font-weight: 500; }
      .choice .txt s { display: block; font-size: 13px; color: #85888e; text-decoration: none; margin-top: 2px; }
      .choice .arr { color: #85888e; font-size: 14px; }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 40px 24px;
      }
      .foot[hidden] { display: none; }
      .dots { display: flex; align-items: center; gap: 5px; }
      .dots i { width: 6px; height: 6px; border-radius: 3px; background: #d4d6da; transition: all 0.3s ease; }
      .dots i.on { width: 20px; background: #4a7dd6; }
      .btns { display: flex; gap: 10px; }
      .btn {
        height: 36px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid transparent;
        font: 500 13.5px/1 "Aeonik", "Inter", system-ui, sans-serif;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.15s;
      }
      .btn:active { transform: scale(0.97); }
      .btn-back { background: #fff; border-color: #dcdee2; color: #111; }
      .btn-back:hover { border-color: #111; }
      .btn-back[hidden] { display: none; }
      .btn-next { background: #141518; color: #fff; }
      .btn-next:hover { opacity: 0.84; }

      .close {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: #85888e;
        font-size: 17px;
        cursor: pointer;
        z-index: 2;
      }
      .close:hover { background: #f1f2f4; color: #111; }

      /* mobile: a bottom sheet — art header on top, copy below. The art row
         is the flexible one, so a two-line title steals header height
         instead of overflowing. */
      @media (max-width: 700px) {
        body { align-items: flex-end; }
        .tag, .chev { display: none; }
        .stage { width: 100%; gap: 0; }
        .modal {
          width: 100vw;
          height: calc(100dvh - 24px);
          border-radius: 20px 20px 0 0;
          grid-template-columns: 1fr;
          grid-template-rows: minmax(150px, 1fr) auto;
        }
        .panel { position: static; } /* the X anchors to the modal: top-right, over the art */
        .content {
          flex: 0 0 auto;
          justify-content: flex-start;
          padding: 24px 24px 20px;
        }
        .content h2 { font-size: 26px; }
        .content p.desc { font-size: 15px; margin-bottom: 14px; }
        .choices { gap: 10px; margin-top: 12px; }
        .foot { padding: 14px 24px 28px; }
        .close { color: #55585d; }
      }
    </style>
    <script type="module" crossorigin src="./assets/onboardingWelcome-CcHIsKCl.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="./assets/instrument-BspKTEgj.js">
    <link rel="modulepreload" crossorigin href="./assets/onboarding-art-DhAV-L10.js">
  </head>
  <body>
    <p class="tag"><b>01 Welcome &amp; new-user intro</b> onboarding art &#183; <a href="./onboarding.html">earn set</a> &#183; <a href="./directions.html">lab</a> &#183; <a href="./platform-cards.html">cards</a></p>
    <div class="stage">
      <button class="chev" id="prev" aria-label="Previous">&#8249;</button>
      <section class="modal" id="modal" aria-live="polite">
        <div class="art" id="art"></div>
        <div class="panel">
          <button class="close" aria-label="Close">&#215;</button>
          <div class="panel-in">
            <div class="content">
              <p class="step" id="step"></p>
              <h2 id="title"></h2>
              <p class="desc" id="copy"></p>
              <a class="learn" id="learn" href="#">Learn more <span>&#8599;</span></a>
              <div class="choices" id="choices" hidden>
                <button class="choice" id="choice-new">
                  <span class="ico">&#10022;</span>
                  <span class="txt"><b>I&rsquo;m new to Kamino</b><s>Start with the basics</s></span>
                  <span class="arr">&#8594;</span>
                </button>
                <button class="choice" id="choice-existing">
                  <span class="ico">&#187;</span>
                  <span class="txt"><b>I&rsquo;m an existing user</b><s>See what&rsquo;s new</s></span>
                  <span class="arr">&#8594;</span>
                </button>
              </div>
            </div>
            <div class="foot" id="foot">
              <div class="dots" id="dots"></div>
              <div class="btns">
                <button class="btn btn-back" id="back">Back</button>
                <button class="btn btn-next" id="next"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <button class="chev" id="fwd" aria-label="Next">&#8250;</button>
    </div>
  </body>
</html>
