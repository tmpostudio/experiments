<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kamino — Onboarding Lab</title>
    <style>
      #stage { background: linear-gradient(180deg, #c6f4ff 0%, #ffffff 72%); }
      .scene-list { display: flex; flex-direction: column; gap: 8px; }
      .scene-list button {
        font: inherit; font-size: 11px; letter-spacing: 0.06em;
        text-transform: uppercase; background: none;
        border: 1px solid var(--line); color: var(--ink);
        padding: 8px 0; cursor: pointer;
      }
      .scene-list button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    </style>
    <script type="module" crossorigin src="./assets/onboardingLab-C8B4gOmm.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
    <link rel="modulepreload" crossorigin href="./assets/Line2-BU82jA1R.js">
    <link rel="modulepreload" crossorigin href="./assets/onboarding-swarm-LQzjGQ_u.js">
    <link rel="stylesheet" crossorigin href="./assets/style-B2Pa0Pwn.css">
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <aside id="panel">
        <header>
          <img src="./kamino-logo.webp" alt="Kamino" class="logo" />
          <p class="sub">onboarding lab</p>
          <p class="version">V0.1</p>
        </header>
        <div class="section-label">Mode</div>
        <div class="seg" id="mode-toggle">
          <button id="mode-morph" class="active">Morph</button>
          <button id="mode-connect">Connect dots</button>
        </div>
        <div class="section-label">Screen</div>
        <div class="scene-list" id="scenes"></div>
        <div class="section-label">Swarm</div>
        <div id="controls"></div>
        <footer>
          <a href="./onboarding-cards.html" class="ghost" style="display:block;text-align:center;text-decoration:none">Modal cards &rarr;</a>
          <a href="./index.html" class="ghost" style="display:block;text-align:center;text-decoration:none">&larr; Illustrations</a>
          <p class="hint">drag rotates the camera</p>
        </footer>
      </aside>
    </div>
  </body>
</html>
